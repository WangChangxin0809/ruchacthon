# UNVERIFIED since the move to a Claude-Code-only engine (docs/decisions/0003).
# The backend container needs the host's Claude Code login: mount ~/.claude
# read-only and pass CLAUDE_CODE_OAUTH_TOKEN if your login uses it. Projects
# must be mounted at the same absolute path they have on the host, because
# worktrees are created next to the project. Prefer the two-terminal setup in
# README.md until this is verified.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8787:8787"
    environment:
      WORKBENCH_MODEL: ${WORKBENCH_MODEL:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - .:/app
      - ${HOME}/.claude:/root/.claude:ro
      - ${WORKBENCH_PROJECTS:-./backend/data/projects}:${WORKBENCH_PROJECTS:-./backend/data/projects}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
