services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8787:8787"
    environment:
      # All optional: the app boots and the dashboard works with none of
      # these set, only /api/chat and /api/subagents need a real key. See
      # README.md's "接真实模型" section.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # The whole repo, bind-mounted over the image's own baked-in copy: when
      # the chat agent's write_file tool (backend/app/fs_tools.py) edits a
      # file, it shows up in `git status` on the host immediately. Safe to
      # mount over pip's install too -- dependencies live under
      # /usr/local/lib/python*/site-packages, which is outside /app and
      # untouched by this mount.
      - .:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
