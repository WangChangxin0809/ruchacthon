# Agent Orchestrator, served as a plain web page for side-by-side comparison
# with CC Workbench. The AO daemon is loopback-only by design; nginx is the
# only thing that reaches it, and basic auth is the only thing that reaches
# nginx. Not a production deployment of AO -- a viewing copy.
server {
    listen 8788;
    server_name _;

    # Loopback (an SSH tunnel on the box) skips the password; everyone else
    # needs it. Credentials in the URL would break the renderer's relative
    # fetches, so the tunnel is how screenshots and smoke tests get in.
    satisfy any;
    allow 127.0.0.1;
    deny all;
    auth_basic "Agent Orchestrator (compare)";
    auth_basic_user_file /etc/nginx/ao-compare.htpasswd;

    root /opt/ao-compare/web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # REST + SSE. Buffering off or the event stream never reaches the browser.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Terminal multiplexer WebSocket.
    location /mux {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host 127.0.0.1:3001;
    }
}
